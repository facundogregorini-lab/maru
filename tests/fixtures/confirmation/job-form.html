<!doctype html>
<html><head><title>Product Manager - Tucán</title></head>
<body>
  <h1>Product Manager</h1>
  <p>Thank you for your interest in Tucán. Apply below.</p>
  <form id="application_form" onsubmit="window.__submitted = (window.__submitted || 0) + 1; return false;">
    <label>First name <input name="first_name"></label>
    <label>Last name <input name="last_name"></label>
    <label>Email <input name="email" type="email"></label>
    <label>Phone <input name="phone"></label>
    <label>Gender <select name="gender"><option></option><option>Female</option><option>Male</option><option>Decline to self identify</option></select></label>
    <label><input type="checkbox" name="consent"> I agree to the privacy policy</label>
    <button type="submit">Submit application</button>
  </form>
</body></html>
