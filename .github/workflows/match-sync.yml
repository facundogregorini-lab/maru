# Sincroniza el inventario de vacantes de "Encontrá tu trabajo perfecto".
# Corre una vez por día (06:17 hora de Argentina) y se puede lanzar a mano desde Actions.
# Sólo hace GET a APIs públicas gratuitas; no usa secretos ni datos de usuarios.
# Si hubo cambios, commitea data/match/*.json (eso dispara el deploy de Vercel con el inventario nuevo).
name: match-sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Opcional: bolsas separadas por coma (ej. greenhouse:clara,remotive)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: match-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # El último commit de la rama al empezar (no el de cuando se encoló): otra corrida
          # del mismo grupo de concurrencia puede haber guardado el inventario mientras esperaba.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar
        env:
          MATCH_SYNC_BUDGET_MS: "1200000"
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            npx --yes tsx@4 scripts/match-sync.ts --only="$ONLY"
          else
            npx --yes tsx@4 scripts/match-sync.ts
          fi
      - name: Vigencia de avisos importados
        # Mira la página original de hasta 400 importados (turnando entre fuentes, 8 minutos como mucho)
        # y cierra los que ya no existen. Si falla, no frena la sync.
        continue-on-error: true
        run: npx --yes tsx@4 scripts/match-liveness.ts --max=400 --budget-min=8
      - name: Guardar inventario
        run: |
          git config user.name "maru-match-bot"
          git config user.email "maru-match-bot@users.noreply.github.com"
          git add data/match/inventory.json data/match/inventory-imported.json data/match/sync-state.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el inventario."
            exit 0
          fi
          git commit -m "chore(match): sincronización de vacantes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
