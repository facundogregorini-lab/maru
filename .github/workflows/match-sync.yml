# Sincroniza el inventario de vacantes de "Encontrá tu trabajo perfecto".
# Corre una vez por día (06:17 hora de Argentina) y se puede lanzar a mano desde Actions.
# Sólo hace GET a APIs públicas gratuitas; no usa secretos ni datos de usuarios.
# Si hubo cambios, commitea data/match/*.json (eso dispara el deploy de Vercel con el inventario nuevo).
name: match-sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Opcional: bolsas separadas por coma (ej. greenhouse:clara,remotive)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: match-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # El último commit de la rama al empezar (no el de cuando se encoló): otra corrida
          # del mismo grupo de concurrencia puede haber guardado el inventario mientras esperaba.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar
        env:
          MATCH_SYNC_BUDGET_MS: "1200000"
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            npx --yes tsx@4 scripts/match-sync.ts --only="$ONLY"
          else
            npx --yes tsx@4 scripts/match-sync.ts
          fi
      - name: Vigencia de avisos importados
        # Mira la página original de hasta 1.500 importados (una cola por fuente, 15 minutos como mucho)
        # y cierra los que ya no existen. Si falla, no frena la sync.
        continue-on-error: true
        run: npx --yes tsx@4 scripts/match-liveness.ts --max=1500 --budget-min=15
      - name: Guardar inventario
        run: |
          git config user.name "maru-match-bot"
          git config user.email "maru-match-bot@users.noreply.github.com"
          git add -A -- "data/match/inventory*.json" data/match/sync-state.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el inventario."
            exit 0
          fi
          # GitHub rechaza archivos de más de 100 MB (así se perdieron las syncs del 14 al 20/11/2026).
          big=$(find data/match -name '*.json' -size +95M)
          [ -z "$big" ] || { echo "::error::Archivos de más de 95 MB: $big"; exit 1; }
          git commit -m "chore(match): sincronización de vacantes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      # Una issue abierta avisa por mail al dueño; se cierra sola con la próxima corrida buena.
      - name: Avisar si falló
        if: ${{ failure() && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="La sincronización de avisos está fallando"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Volvió a fallar: $RUN_URL"
          else
            gh issue create --title "$title" --body "La corrida $RUN_URL falló. Mientras siga así, el catálogo de /match no se actualiza y los importados se siguen venciendo."
          fi
      - name: Cerrar el aviso si volvió a andar
        if: ${{ success() && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="La sincronización de avisos está fallando"
          for n in $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Volvió a andar: $RUN_URL"
          done
