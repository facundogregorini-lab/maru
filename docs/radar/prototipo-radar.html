const nav=[['brief','Búsquedas'],['target','Match'],['radar','Radar laboral'],['file','CV'],['send','Postular'],['mail','Carta'],['chat','Entrevista'],['video','Video'],['kanban','Seguimiento'],['ext','Extensión']];document.querySelector('#nav').innerHTML=nav.map(([i,n])=>`<div class="navitem ${i==='radar'?'active':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[i]}</svg><span>${n}</span></div>`).join('');
const tabs=['Mis empresas','Oportunidades','Descubrimiento','Automatización'];let tab=0,sector='Todas',priority='Todas',search='',region='Todas',minScore=0,jobView='Todas',suggestDone={},toastTimer;const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const companies=[['Anthropic','IA','Global','EEUU','P1','#b77d60','A','3'],['OpenAI','IA','Global','EEUU','P1','#171717','O','3'],['ElevenLabs','IA','Global','Reino Unido / EEUU','P1','#171717','Ⅱ','3'],['Supabase','Tech Startups','Global','Singapur / EEUU','P1','#23976a','S','2'],['Humand','IA|Tech Startups','LatAm','Argentina','P1','#6554d6','H','1'],['The Exploration Company','Space','Global','Europa','P1','#344151','T','1'],['Vercel','IA|Tech Startups','LatAm','Argentina / EEUU','P2','#161616','▲','2'],['PostHog','Tech Startups','Global','EEUU / Reino Unido','P2','#d98a36','P','1'],['Mistral AI','IA','Global','Francia','P2','#ee8524','M','1'],['PLD Space','Space','Global','España','P2','#405c95','P','—'],['ICEYE','Space','Global','Finlandia','P2','#394553','I','—'],['Linear','Tech Startups','Global','EEUU','P3','#6554d6','L','—']].map(([n,s,r,l,p,c,a,j])=>({n,s,r,l,p,c,a,j,status:'Pendiente de verificar'}));
const jobs=[['Humand','Head of Marketing / CMO',94,'Argentina · Remoto','Dirección integral y liderazgo de scaleup.','Compensación y alcance','https://careers.humand.co/jobs'],['ElevenLabs','B2B Marketing – LATAM Southern Cone',91,'Southern Cone · País a confirmar','Demand gen regional y partnerships.','Elegibilidad y alcance','https://elevenlabs.io/careers/c340cedd-6453-4d48-a580-359c1d7d9d49/b2b-marketing-latam-southern-cone'],['OpenAI','Growth Lead, Brazil',89,'São Paulo','Liderazgo de crecimiento de ChatGPT.','Portugués y relocalización','https://openai.com/careers/growth-lead-brazil-sao-paulo/'],['Supabase','Growth Manager, GEO / AEO',88,'Remoto AMER','Growth orgánico y motores de respuesta IA.','Confirmar Argentina y compensación','https://supabase.com/careers'],['Stripe','Regional Product Marketing Manager, Latin America',84,'LatAm · País a confirmar','Marketing de producto y expansión regional.','Confirmar país y alcance','']].map(([n,t,s,l,w,b,u])=>({n,t,s,l,w,b,u,state:'Nueva'}));
const suggestions=[['Lovable','IA · Suecia','Producto AI-native, crecimiento y PLG.','#d66d91','L','IA'],['Clay','IA · EEUU','Automatización de GTM y growth B2B.','#6474c7','C','IA'],['n8n','Automatización · Alemania','Intersección entre producto, agentes y automatización.','#d9507f','n','Tech Startups']];let settings={enabled:true,p1:'Diaria',p2:'Semanal',p3:'Mensual',day:'Lunes',time:'09:00',tz:'America/Argentina/Buenos_Aires',instant:true,digest:true,threshold:85};
const av=(c)=>`<span class="avatar" style="background:${c?.c||'#596275'}">${esc(c?.a||c?.n?.[0]||'?')}</span>`;const stat=(l,n,d)=>`<div class="stat"><span class="label">${l}</span><strong>${n}</strong><span class="small">${d}</span></div>`;const stats=(items)=>`<div class="stats">${items.map(x=>stat(...x)).join('')}</div>`;const pills=p=>`<span class="pill ${p==='P1'?'p1':''}">${esc(p)}</span>`;const sects=['Todas','IA','Space','Tech Startups'];const options=(arr,val)=>arr.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');const note=s=>`<div class="note">${s}</div>`;
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3500)}function drawer(title,body){document.querySelector('#drawer').innerHTML=`<div class="drawerhead"><h2>${esc(title)}</h2><button onclick="closeDrawer()" aria-label="Cerrar">✕</button></div>${body}`;document.querySelector('#overlay').classList.add('open');document.querySelector('#drawer button').focus()}function closeDrawer(){document.querySelector('#overlay').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
function switchTab(i){tab=i;sector='Todas';render()}function render(){document.querySelector('#tabs').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'active':''}" onclick="switchTab(${i})" ${i===tab?'aria-current="page"':''}>${t}</button>`).join('');document.querySelector('#content').innerHTML=[renderCompanies,renderJobs,renderSuggestions,renderSettings][tab]();}
function companyRows(){return companies.map((c,i)=>({...c,i})).filter(c=>(sector==='Todas'||c.s.split('|').includes(sector))&&(priority==='Todas'||c.p===priority)&&(region==='Todas'||c.r===region)&&c.n.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.p.localeCompare(b.p)).map(c=>`<tr><td><div class="namecell">${av(c)}<div><b>${esc(c.n)}</b><span class="small">${esc(c.s.replaceAll('|',' · '))}</span></div></div></td><td>${esc(c.l)}<div class="small">${esc(c.r)}</div></td><td><select class="field" aria-label="Prioridad de ${esc(c.n)}" onchange="companies[${c.i}].p=this.value;render()">${options(['P1','P2','P3'],c.p)}</select></td><td><b>${esc(c.j)}</b> <span class="small">piloto</span></td><td><span class="pill warn">${esc(c.status)}</span><div class="small">Último dato: 25 nov.</div></td><td><button onclick="openCompany(${c.i})">Ver ficha ›</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay empresas para estos filtros.</td></tr>'}
function renderCompanies(){return stats([['Prioridad 1',companies.filter(c=>c.p==='P1').length,'Objetivo sugerido: 20'],['Prioridad 2',companies.filter(c=>c.p==='P2').length,'Objetivo sugerido: 100'],['Por explorar',companies.filter(c=>c.p==='P3').length,'P3 · sin límite fijo'],['Fuentes pendientes',companies.length,'Verificar antes de monitorear']])+`<div class="panel"><div class="sectionhead"><h3>Mis empresas</h3><div class="actions"><button onclick="openImport()">↑ Importar empresas</button><button class="green" onclick="openAdd()">+ Agregar empresa</button></div></div>${note('Vista de muestra: 12 empresas iniciales. El Sheet completo contiene 273 registros antes de deduplicar.') }<div class="chips">${sects.map(s=>`<button class="${s===sector?'active':''}" onclick="sector='${s}';render()">${s}</button>`).join('')}</div><div class="filters"><input id="search" placeholder="Buscar empresa…" aria-label="Buscar empresa" value="${esc(search)}" oninput="search=this.value;document.querySelector('#companyRows').innerHTML=companyRows()"><select aria-label="Prioridad" onchange="priority=this.value;render()">${options(['Todas','P1','P2','P3'],priority)}</select><select aria-label="Región" onchange="region=this.value;render()">${options(['Todas','LatAm','Global'],region)}</select></div><div class="tablewrap"><table class="table"><thead><tr><th>EMPRESA</th><th>UBICACIÓN</th><th>PRIORIDAD</th><th>VACANTES RELEVADAS</th><th>ESTADO DE FUENTE</th><th></th></tr></thead><tbody id="companyRows">${companyRows()}</tbody></table></div></div>`}
function openCompany(i){const c=companies[i];drawer(c.n,`<div class="namecell">${av(c)}<div><b>${esc(c.n)}</b><span class="small">${esc(c.s)} · ${esc(c.l)}</span></div></div><p>${pills(c.p)} <span class="pill warn">Fuente pendiente</span></p><label>Prioridad<select class="field" onchange="companies[${i}].p=this.value;render()">${options(['P1','P2','P3'],c.p)}</select></label><h3>Vacantes del piloto</h3><p><b>${esc(c.j)}</b> oportunidades relevadas el 25/11. No verificadas hoy.</p><h3>Monitoreo</h3><p>Frecuencia: ${esc(settings[c.p.toLowerCase()])}. Última revisión exitosa: sin verificar.</p><label>Notas personales<textarea class="field" rows="3" onchange="companies[${i}].notes=this.value">${esc(c.notes||'')}</textarea></label><div class="actions"><button class="green" onclick="notify('Demo: en producción encola una revisión real.')">Revisar ahora</button><button onclick="companies.splice(${i},1);closeDrawer();render();notify('Empresa quitada de la muestra')">Dejar de seguir</button></div>`)}
function openAdd(){drawer('Agregar empresa',`<p class="small">Ingresá una empresa y su página oficial de Careers si la conocés.</p><form onsubmit="event.preventDefault();addCompany(this)"><label>Nombre<input class="field" name="n" required placeholder="Ej. Anthropic"></label><label>Careers URL (opcional)<input class="field" name="url" type="url" placeholder="https://..."></label><label>Industria<select class="field" name="s">${options(sects.slice(1),'IA')}</select></label><label>Prioridad<select class="field" name="p">${options(['P1','P2','P3'],'P2')}</select></label><button class="green" type="submit">Agregar a mis empresas</button></form>`)}function addCompany(f){const d=new FormData(f),n=d.get('n').trim();if(!n)return;if(companies.some(c=>c.n.toLowerCase()===n.toLowerCase())){notify('La empresa ya está en la lista.');return}companies.push({n,s:d.get('s'),r:'A confirmar',l:'A confirmar',p:d.get('p'),a:n[0].toUpperCase(),c:'#596275',j:'—',url:d.get('url'),status:'Pendiente de verificar'});closeDrawer();switchTab(0);notify('Empresa agregada a la muestra')}
function openImport(){drawer('Importar empresas',`<p>Importá las pestañas IA, Space y Tech Startups de Research Laboral.</p><a href="https://docs.google.com/spreadsheets/d/1OZf2mWFzyqTT3wMCO5ngHU1HQH8787sHdvDQS3YrRZQ/edit" target="_blank" rel="noopener">Abrir Sheet de referencia ↗</a><h3>Vista previa esperada</h3><div class="stack"><div class="why">55 · IA</div><div class="why">56 · Space Exploration</div><div class="why">162 · Tech Startups</div></div><p class="small">273 registros antes de deduplicar. La implementación debe validar dominios, conservar etiquetas y excluir encabezados y cobertura.</p><button class="green" onclick="notify('Importación ilustrativa: requiere backend de Maru.')">Previsualizar importación (demo)</button>`)}
function jobCards(){return jobs.map((j,i)=>({...j,i})).filter(j=>j.s>=minScore&&(jobView==='Todas'?j.state!=='Descartada':j.state===jobView)).sort((a,b)=>b.s-a.s).map(j=>{const c=companies.find(x=>x.n===j.n);return `<article class="job"><div class="jobtop">${av(c||{n:j.n})}<div class="jobtitle"><span class="small">${esc(j.n)} ${c?pills(c.p):''}</span><h3>${esc(j.t)}</h3><span class="small">${esc(j.l)}</span></div><div><div class="score">${j.s}<span style="font-size:12px">/100</span></div><div class="small">Score piloto</div></div></div><div class="why"><b>Por qué encaja</b><br>${esc(j.w)}<br><span class="small">A verificar: ${esc(j.b)}</span></div><div class="small">25/11 · vigencia no verificada ${j.state==='Guardada'?'· Guardada':''}</div><div class="jobbottom"><button class="green" onclick="openJob(${j.i})">Analizar oportunidad</button><button onclick="saveJob(${j.i})">${j.state==='Guardada'?'✓ Guardada':'Guardar'}</button><button onclick="jobs[${j.i}].state='Descartada';render();notify('Oportunidad descartada en demo')" aria-label="Descartar">✕</button></div></article>`}).join('')||'<div class="empty">No hay oportunidades con estos filtros.</div>'}
function renderJobs(){return stats([['Vacantes piloto',40,'Tres industrias'],['Score ≥ 85',4,'Ranking histórico'],['Empresas piloto',30,'10 por industria, sin deduplicar'],['Guardadas demo',jobs.filter(j=>j.state==='Guardada').length,'Integración Seguimiento']])+note('Los datos del piloto son históricos y el score es editorial, no probabilidad de contratación. Las acciones son simuladas.')+`<div class="sectionhead"><h3>Tus mejores oportunidades</h3><span class="small">Orden: score del piloto</span></div><div class="filters"><select aria-label="Estado" onchange="jobView=this.value;render()">${options(['Todas','Nueva','Guardada','Descartada'],jobView)}</select><select aria-label="Score mínimo" onchange="minScore=+this.value;render()">${[0,70,80,85,90].map(v=>`<option value="${v}" ${minScore===v?'selected':''}>${v?'Score ≥ '+v:'Todos los scores'}</option>`).join('')}</select></div><div class="joblist">${jobCards()}</div>`}
function saveJob(i){jobs[i].state='Guardada';render();notify('Guardada en demo · producción: crea una tarjeta en Seguimiento')}
function openJob(i){const j=jobs[i];drawer(j.n,`<h2>${esc(j.t)}</h2><p class="score">${j.s}/100</p><p class="small">Score histórico, no probabilidad · ${esc(j.l)}</p><h3>Fortaleza principal</h3><p>${esc(j.w)}</p><h3>Barreras / datos pendientes</h3><p>${esc(j.b)}</p><h3>Próximo paso</h3><p>Validar vigencia, requisitos excluyentes y alcance antes de postularte.</p>${j.u?`<p><a href="${esc(j.u)}" target="_blank" rel="noopener">Ver fuente del piloto ↗</a></p>`:''}<div class="actions"><button class="green" onclick="saveJob(${i});closeDrawer()">Guardar oportunidad</button><button onclick="notify('En producción abre el flujo CV existente')">Adaptar mi CV</button></div>`)}
function renderSuggestions(){return `<div class="sectionhead"><h3>Empresas que Maru descubrió para vos</h3><span class="small">Revisión semanal</span></div>${note('Ejemplos del Sheet, no descubrimientos nuevos confirmados. En producción se excluyen las empresas que ya seguís.')}<div class="suggestgrid">${suggestions.map(([n,d,r,c,a,s],i)=>`<article class="suggestion"><div class="namecell">${av({c,a})}<div><h3>${esc(n)}</h3><span class="small">${esc(d)}</span></div></div><p>${esc(r)}</p><span class="small">Señales de contratación: pendientes de validar</span>${suggestDone[i]?`<span class="pill p1">${esc(suggestDone[i])}</span>`:`<div class="actions"><button class="green" onclick="acceptSuggestion(${i},'P1')">+ P1</button><button onclick="acceptSuggestion(${i},'P2')">+ P2</button><button class="quiet" onclick="suggestDone[${i}]='Descartada';render()">No me interesa</button></div>`}</article>`).join('')}</div>`}
function acceptSuggestion(i,p){const [n,d,r,c,a,s]=suggestions[i];if(!companies.some(x=>x.n===n))companies.push({n,s,r:'Global',l:d,p,c,a,j:'—',status:'Pendiente de verificar'});suggestDone[i]='Agregada a '+p;render();notify(n+' agregada a '+p+' en demo')}
const setting=(title,desc,control)=>`<div class="settingrow"><div><h4>${title}</h4><div class="small">${desc}</div></div>${control}</div>`;const sel=(key,arr)=>`<select class="field" aria-label="${key}" onchange="settings.${key}=this.value">${options(arr,settings[key])}</select>`;const toggle=(key)=>`<input class="toggle" type="checkbox" aria-label="${key}" ${settings[key]?'checked':''} onchange="settings.${key}=this.checked">`;
function renderSettings(){return note('Configuración ilustrativa. No ejecuta tareas reales ni envía notificaciones.')+`<div class="settingsgrid"><div><section class="panel"><h3>Frecuencia de monitoreo</h3>${setting('Radar activo','Maru revisa las fuentes de las empresas seguidas.',toggle('enabled'))}${setting('Prioridad 1','Dream companies · objetivo 20',sel('p1',['Diaria','Semanal','Mensual','Pausada']))}${setting('Prioridad 2','Target companies · objetivo 100',sel('p2',['Diaria','Semanal','Mensual','Pausada']))}${setting('Prioridad 3','Exploración',sel('p3',['Semanal','Mensual','Pausada']))}</section><section class="panel"><h3>Alertas y reporte semanal</h3>${setting('Alertas P1','Match alto y sin bloqueo confirmado.',toggle('instant'))}${setting('Score mínimo','Para alertas prioritarias.',`<select class="field" onchange="settings.threshold=+this.value">${options(['80','85','90','95'],String(settings.threshold))}</select>`)}${setting('Resumen semanal','Top 5 oportunidades + cobertura.',toggle('digest'))}${setting('Día', 'Entrega del reporte',sel('day',['Lunes','Martes','Miércoles','Jueves','Viernes']))}${setting('Hora','Zona horaria de tu perfil',`<input class="field" type="time" aria-label="Hora" value="${settings.time}" onchange="settings.time=this.value">`)}<label class="small">Zona horaria<input class="field" style="width:100%;margin-top:5px" value="${esc(settings.tz)}" onchange="settings.tz=this.value"></label><div class="actions" style="margin-top:12px"><button class="green" onclick="notify('Preferencias guardadas en memoria de demo')">Guardar preferencias</button></div></section></div><div><section class="panel"><h3>Estado de monitoreo</h3><span class="pill warn">Sin conexión al backend</span><p class="small">Último piloto: 25/11/2026. Las fuentes deben validarse antes de activar el monitoreo.</p><div class="settingrow"><span>Fuentes verificadas hoy</span><b>—</b></div><div class="settingrow"><span>Próxima ejecución</span><b>Sin configurar</b></div><button class="green" onclick="notify('Demo: no se ejecutó una revisión real')">Revisar ahora</button></section><section class="panel"><h3>Preferencias de Match</h3><p class="small">Ponderación inicial configurable en producción.</p>${[['Experiencia y competencias',40],['Seniority y alcance',20],['Ubicación y elegibilidad',20],['Compensación y equity',10],['Interés por empresa/sector',10]].map(([n,v])=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px"><span>${n}</span><b>${v}%</b></div><div class="bar"><span style="width:${v}%"></span></div></div>`).join('')}<p class="small">Requisitos excluyentes confirmados no se compensan con un score alto.</p></section></div></div>`}render();
</script></body></html>
